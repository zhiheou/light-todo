<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8B91E8" />
    <link rel="icon" href="data:," />
    <title>轻待办</title>
    <!-- 字体：楷体（霞鹜文楷）+ Noto Sans SC；主题切换按需加载 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" />
    <!-- 首屏前恢复主题偏好，避免刷新后先闪默认样式再切换 -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("lighttodo:theme:v1");
          if (!raw) return;
          var t = JSON.parse(raw);
          var accents = {
            purple: { coral: "#8B91E8", soft: "#E7E8FB", ink: "#6D74D6" },
            graphite: { coral: "#52525B", soft: "#EEEEF0", ink: "#3F3F46" },
            mistBlue: { coral: "#6B8CAE", soft: "#E8EEF4", ink: "#567596" },
            sageGreen: { coral: "#7A9E8E", soft: "#EAF0EC", ink: "#5F8575" }
          };
          var fonts = {
            kai: "'LXGW WenKai','LXGW WenKai TC','LXGW WenKai Screen','PingFang SC','Microsoft YaHei',sans-serif",
            sans: "'PingFang SC',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'Microsoft YaHei',sans-serif",
            song: "'Songti SC','STSong','SimSun','Noto Serif SC',serif",
            noto: "'Noto Sans SC','PingFang SC',-apple-system,BlinkMacSystemFont,sans-serif"
          };
          var sizes = { small: "0.9", standard: "1", large: "1.15", extraLarge: "1.3" };
          var r = document.documentElement;
          var a = accents[t.accent] || accents.purple;
          r.style.setProperty("--coral", a.coral);
          r.style.setProperty("--coral-soft", a.soft);
          r.style.setProperty("--coral-ink", a.ink);
          r.style.setProperty("--accent", a.coral);
          r.style.setProperty("--primary", a.coral);
          r.style.setProperty("--accent-soft", a.soft);
          r.style.setProperty("--font-app", fonts[t.font] || fonts.kai);
          r.style.setProperty("--app-font-scale", sizes[t.fontSize] || "1");
          r.dataset.cardStyle = ["classic", "plain", "colorful"].indexOf(t.cardStyle) >= 0 ? t.cardStyle : "classic";
        } catch (e) { /* 隐私模式 */ }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
