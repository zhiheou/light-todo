name: 构建桌面版安装包

# 为什么要有这个文件（重要）：
#   Mac 的安装包**只能在 Mac 上造**，Windows 造不出来（苹果的签名/打包工具链限制）。
#   所以这里借用 GitHub 免费提供的云端苹果电脑来造 Mac 包，造好自动挂到 Releases 供下载。
#   用户那台苹果笔记本什么都不用装。
#
# 触发方式：
#   1) 推送 tag（如 v3.9.4）→ 自动造 Windows + Mac 包并发布
#   2) 在 GitHub 网页 Actions 页手动点「Run workflow」→ 只造，不发布

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # 需要写权限才能把安装包挂到 Releases

jobs:
  # ---------- Windows 安装包 ----------
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖（用国内镜像，避免 Electron 二进制下载失败）
        working-directory: desktop
        run: npm install --registry=https://registry.npmmirror.com
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: 生成图标
        working-directory: desktop
        run: node scripts/make-icons.mjs

      - name: 打包 Windows 安装包
        working-directory: desktop
        run: npx electron-builder --win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
          if-no-files-found: error

  # ---------- macOS 安装包（Intel + Apple 芯片） ----------
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        working-directory: desktop
        run: npm install --registry=https://registry.npmmirror.com
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: 生成图标（.icns 必须在这台 Mac 上造）
        working-directory: desktop
        run: node scripts/make-icons.mjs

      - name: 打包 macOS 安装包（x64 + arm64 通用）
        working-directory: desktop
        run: npx electron-builder --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # 没买苹果签名证书 → 跳过签名（用户首次需右键打开）

      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error

  # ---------- 打 tag 时自动发版 ----------
  release:
    needs: [build-win, build-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-installer/*
            artifacts/mac-installer/*
          generate_release_notes: true
          body: |
            ## 轻待办桌面版 ${{ github.ref_name }}

            **Windows**：下载 `.exe` 双击安装。
            **Mac**：下载 `.dmg`，拖进「应用程序」。首次打开请**右键点图标 → 打开 → 再点打开**
            （独立开发者未购买苹果签名证书，这是苹果对所有小团队软件的统一提示，不代表软件有问题）。

            装好后用你的账号登录一次，桌宠就会常驻桌面。
